<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vox Workhorse WebUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; margin-bottom: 12px; }
        .card-header { background-color: #252525; border-bottom: 1px solid #333; color: #00bcd4; font-weight: bold; padding: 0.45rem 0.75rem; }
        .card-body { padding: 0.6rem 0.75rem; }
        .badge-vram { background-color: #ff9800; color: #000; font-weight: bold; }
        .badge-status { font-size: 0.8rem; }
        .lora-slider { width: 100%; }
        .prompt-box { background-color: #252525; border: 1px solid #444; color: #fff; border-radius: 4px; padding: 8px; width: 100%; margin-top: 8px; font-size: 0.85rem; }
        .btn-query { background-color: #00bcd4; color: #000; font-weight: bold; margin-top: 8px; }
        .btn-query:hover { background-color: #0097a7; }
        .status-up { color: #4caf50; }
        .status-exited { color: #f44336; }
        .lora-controls { padding: 8px; background: #252525; border-radius: 4px; margin-top: 8px; border: 1px dashed #444; }
        .btn-control { font-size: 0.7rem; font-weight: bold; padding: 1px 7px; margin-right: 5px; border: none; border-radius: 3px; }
        .btn-start { background-color: #4caf50; color: white; }
        .btn-stop { background-color: #f44336; color: white; }
        .btn-idle { background-color: #ff9800; color: black; }

        /* Workhorse UI v2: project tabs + compact layout */
        #project-tabs .nav-link {
            color: #bbb;
            border: 1px solid #444;
            border-radius: 16px;
            padding: 2px 14px;
            font-size: 0.8rem;
            margin-right: 6px;
            margin-bottom: 4px;
            background: transparent;
        }
        #project-tabs .nav-link:hover { color: #fff; border-color: #00bcd4; }
        #project-tabs .nav-link.active {
            background-color: #00bcd4;
            border-color: #00bcd4;
            color: #111;
            font-weight: 700;
        }
        .container h3 { font-size: 1.1rem; margin-bottom: 0.4rem; }
        #vram-percent { font-size: 1.6rem; margin-bottom: 0.1rem; }
        #vram-peaks { max-height: 44px; }
        @media (max-width: 576px) {
            .navbar-brand { font-size: 0.9rem; }
            .navbar .container-fluid { flex-wrap: wrap; }
        }
        
        /* Image Pop-out Overlay */
        #image-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            z-index: 10000;
            cursor: zoom-out;
            justify-content: center;
            align-items: center;
        }
        #image-overlay img {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <div id="image-overlay" onclick="closeOverlay()">
        <img id="overlay-img" src="" alt="Full size preview">
    </div>
    <nav class="navbar navbar-dark bg-dark mb-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">VOX WORKHORSE CONTROL PANEL</span>
            <span class="ms-auto d-flex align-items-center" style="gap: 8px;">
                <span class="small" style="color: #aaa;">C-3PO Voice</span>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" id="c3po-mute-switch" role="switch">
                    <label class="form-check-label small" for="c3po-mute-switch" id="c3po-mute-label">On</label>
                </div>
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-3">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">GPU TELEMETRY: AMD RX 7900 (Workhorse VRAM)</div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-3 text-center">
                                <h2 id="vram-percent">0%</h2>
                                <p class="small text-muted mb-0">VRAM ALLOCATION</p>
                                <p class="small text-info mb-0" id="vram-last-sync" style="font-size: 0.6rem;"></p>
                            </div>
                            <div class="col-md-6 d-flex align-items-center">
                                <div class="small fw-bold text-info">USED: <span id="vram-used">0 GB</span> / 32 GB TOTAL</div>
                            </div>
                            <div class="col-md-3 border-start border-secondary">
                                <p class="small fw-bold mb-1 text-warning">HIGH WATERMARK LOG</p>
                                <div id="vram-peaks" style="font-size: 0.75rem; color: #aaa; max-height: 60px; overflow-y: auto;">
                                    <!-- Peaks will be listed here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-1">
                    <h3 class="mb-0">System Workhorses</h3>
                    <div class="nav nav-pills" id="project-tabs" role="tablist" aria-label="Filter containers by project">
                        <!-- Project tabs injected by JS -->
                    </div>
                </div>
                <div id="project-bar" class="d-none mb-2 p-2" style="background:#1a1a1a; border:1px solid #333; border-radius:6px;">
                    <div class="small text-info" id="project-ai"></div>
                    <div class="small text-muted" id="project-repo"></div>
                    <div class="d-flex align-items-center gap-2 mt-1 flex-wrap">
                        <button class="btn-control btn-start" id="bulk-start-all">▶ START ALL</button>
                        <button class="btn-control btn-stop" id="bulk-stop-all">⏹ STOP ALL</button>
                        <span class="small text-muted" id="bulk-status"></span>
                    </div>
                </div>
                <div id="container-list">
                    <!-- Containers will be loaded here -->
                </div>
            </div>
            <div class="col-md-4">
                <h3>Model Assets</h3>
                <div class="card">
                    <div class="card-header">Base Models & Quants</div>
                    <ul class="list-group list-group-flush" id="model-list">
                        <!-- Models will be loaded here -->
                    </ul>
                </div>
                <div class="card">
                    <div class="card-header">Active LoRAs</div>
                    <div class="card-body" id="lora-list">
                        <!-- LoRAs with sliders will be here -->
                        <p class="text-muted small">No LoRAs found in /loras</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function renderControls(name, actualName) {
            return `
                <div class="d-flex mb-2">
                    <button class="btn-control btn-start" onclick="controlContainer('${actualName}', 'start')">START</button>
                    <button class="btn-control btn-stop" onclick="controlContainer('${actualName}', 'stop')">STOP</button>
                    <button class="btn-control btn-idle" onclick="controlContainer('${actualName}', 'stop')">IDLE</button>
                </div>
                <textarea class="prompt-box" id="prompt-${name}" placeholder="Enter manual query/prompt for ${name}..."></textarea>
                <button class="btn btn-sm btn-query" onclick="queryService('${name}')">EXECUTE REQUEST</button>
                <div class="mt-2 small text-info" id="result-${name}"></div>
            `;
        }

        function renderSettingsRow(name, c) {
            const options = ['no', 'on-failure', 'always', 'unless-stopped', 'never']
                .map(p => `<option value="${p}" ${p === c.restart_policy ? 'selected' : ''}>${p}</option>`).join('');
            return `
                <div class="d-flex align-items-center gap-2 small text-muted flex-wrap mt-1" id="settings-${name}" title="0 = unlimited">
                    <span>CPU:</span>
                    <input type="number" class="form-control form-control-sm" id="cpu-${name}" style="width:64px" min="0" step="0.5" value="${c.cpu_cores ?? 0}">
                    <span>MEM:</span>
                    <input type="number" class="form-control form-control-sm" id="mem-${name}" style="width:64px" min="0" step="0.5" value="${c.mem_limit_gb ?? 0}">
                    <span>RESTART:</span>
                    <select class="form-select form-select-sm" id="restart-${name}" style="width:112px">${options}</select>
                    <button class="btn-control btn-start" onclick="applySettings('${c.name}')">APPLY</button>
                    <span class="small text-info" id="setstat-${name}"></span>
                </div>
            `;
        }

        async function applySettings(name) {
            const safe = name.replace(/[^a-zA-Z0-9]/g, '_');
            const stat = document.getElementById(`setstat-${safe}`);
            const payload = {
                cpu_cores: parseFloat(document.getElementById(`cpu-${safe}`).value) || 0,
                mem_limit_gb: parseFloat(document.getElementById(`mem-${safe}`).value) || 0,
                restart_policy: document.getElementById(`restart-${safe}`).value,
            };
            stat.innerText = 'Applying…';
            try {
                const resp = await fetch(`/api/container/${encodeURIComponent(name)}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await resp.json();
                if (data.settings) {
                    stat.innerText = `Applied: CPU ${data.settings.cpu_cores} · MEM ${data.settings.mem_limit_gb}GB · RESTART ${data.settings.restart_policy}`;
                    setTimeout(() => { stat.innerText = ''; }, 6000);
                } else {
                    stat.innerText = 'Error: ' + (data.error || 'unknown');
                }
            } catch (e) {
                stat.innerText = 'Network error: ' + e.message;
            }
        }

        async function controlContainer(name, action) {
            try {
                const resp = await fetch(`/api/container/${name}/${action}`, {method: 'POST'});
                const data = await resp.json();
                if (data.status === 'success') {
                    fetchContainers(); 
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) { alert("Network error: " + e.message); }
        }

        // Workhorse UI v3: per-repo project tabs + bulk power controls
        let activeTab = 'All';
        let projectRegistry = [];

        function orderedTabs(containerProjects) {
            const set = new Set();
            (containerProjects || []).forEach(p => (p || '').split(',').forEach(x => { const t = x.trim(); if (t) set.add(t); }));
            const names = projectRegistry.map(p => p.name).filter(n => set.has(n));
            const other = set.has('Other') ? ['Other'] : [];
            return ['All', ...names, ...other];
        }

        function activeProjectInfo() {
            if (activeTab === 'All' || activeTab === 'Other') return null;
            return projectRegistry.find(p => p.name === activeTab) || null;
        }

        function renderTabs(containerProjects) {
            const bar = document.getElementById('project-tabs');
            const tabs = orderedTabs(containerProjects);
            const key = tabs.join(',');
            if (bar.dataset.tabs === key) return;
            bar.dataset.tabs = key;
            bar.innerHTML = '';
            tabs.forEach(p => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nav-link' + (p === activeTab ? ' active' : '');
                btn.textContent = p;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', () => setActiveTab(p));
                bar.appendChild(btn);
            });
        }

        function cardInTab(card, tab) {
            if (tab === 'All') return true;
            return (card.dataset.project || '').split(',').includes(tab);
        }

        function renderProjectBar() {
            const info = activeProjectInfo();
            const bar = document.getElementById('project-bar');
            if (!info) {
                bar.classList.add('d-none');
                return;
            }
            bar.classList.remove('d-none');
            document.getElementById('project-ai').textContent = 'AI: ' + info.ai;
            document.getElementById('project-repo').textContent = 'Repo: ' + info.repo;

            const status = document.getElementById('bulk-status');
            const up = info.containers.filter(c => (c.status || '').includes('Up')).length;
            status.textContent = `${info.containers.length} containers · ${up} up`;
        }

        function setActiveTab(p) {
            activeTab = p;
            document.querySelectorAll('#project-tabs .nav-link').forEach(b => {
                b.classList.toggle('active', b.textContent === p);
            });
            document.querySelectorAll('#container-list .card').forEach(card => {
                card.style.display = cardInTab(card, p) ? '' : 'none';
            });
            renderProjectBar();
        }

        async function fetchProjects() {
            try {
                const resp = await fetch('/api/projects');
                const data = await resp.json();
                projectRegistry = data.projects || [];
                renderTabs([...document.querySelectorAll('#container-list .card')]
                    .flatMap(c => (c.dataset.project || '').split(',').filter(Boolean)));
                renderProjectBar();
            } catch (e) { console.error("Projects fetch error", e); }
        }

        async function bulkAction(turnOn) {
            const info = activeProjectInfo();
            if (!info) return;
            if (!turnOn && !confirm(`Stop ALL ${info.name} containers? This includes: ${info.containers.map(c => c.name).join(', ')}`)) return;
            const status = document.getElementById('bulk-status');
            status.textContent = turnOn ? 'Starting all…' : 'Stopping all…';
            try {
                const resp = await fetch(`/api/project/${encodeURIComponent(info.name)}/${turnOn ? 'start' : 'stop'}`, { method: 'POST' });
                const data = await resp.json();
                status.textContent = `${data.ok}/${data.total} ${turnOn ? 'started' : 'stopped'}`;
                fetchContainers();
                fetchProjects();
            } catch (err) {
                status.textContent = 'Error: ' + err.message;
            }
        }

        document.getElementById('bulk-start-all').addEventListener('click', () => bulkAction(true));
        document.getElementById('bulk-stop-all').addEventListener('click', () => bulkAction(false));

        async function fetchContainers() {
            try {
                const resp = await fetch('/api/containers');
                const data = await resp.json();
                const list = document.getElementById('container-list');

                renderTabs(data.flatMap(c => (c.project || '').split(',').filter(Boolean)));
                renderProjectBar();

                data.forEach(c => {
                    const safeName = c.name.replace(/[^a-zA-Z0-9]/g, '_');
                    let card = document.getElementById(`card-${safeName}`);
                    const isUp = c.status.toLowerCase().includes('up');

                    if (!card) {
                        const cardHtml = `
                            <div class="card" id="card-${safeName}" data-project="${c.project}">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <span>${c.name} <small class="text-muted">(${c.role})</small></span>
                                    <span class="badge badge-vram" id="vram-${safeName}">${c.vram}</span>
                                </div>
                                <div class="card-body">
                                    <p class="mb-1"><small>Stack: ${c.stack} | Image: ${c.image}</small></p>
                                    <p class="mb-2 badge-status" id="status-${safeName}">${c.status}</p>
                                    <p class="mb-2 small text-muted" id="diag-${safeName}">
                                        RAM: ${c.mem_usage || '—'} ${c.mem_percent ? '(' + c.mem_percent + ')' : ''} · PEAK: ${c.peak_mem_gb != null ? c.peak_mem_gb + ' GB' : '—'} · CPU: ${c.cpu_percent || '—'} · PIDs: ${c.pids || '—'}
                                    </p>
                                    <div class="mb-2">${renderSettingsRow(safeName, c.settings || {})}</div>
                                    <div id="controls-${safeName}">
                                        ${renderControls(safeName, c.name)}
                                    </div>
                                </div>
                            </div>
                        `;
                        list.insertAdjacentHTML('beforeend', cardHtml);
                        const newCard = document.getElementById(`card-${safeName}`);
                        if (activeTab !== 'All' && !(c.project || '').split(',').includes(activeTab)) {
                            newCard.style.display = 'none';
                        }
                    } else {
                        const statusEl = document.getElementById(`status-${safeName}`);
                        if (statusEl.innerText !== c.status) {
                            statusEl.innerText = c.status;
                            statusEl.className = `mb-2 badge-status ${isUp ? 'status-up' : 'status-exited'}`;
                        }

                        const vramEl = document.getElementById(`vram-${safeName}`);
                        if (vramEl.innerText !== c.vram) vramEl.innerText = c.vram;

                        const diagEl = document.getElementById(`diag-${safeName}`);
                        if (diagEl) {
                            const mem = c.mem_usage || '—';
                            const pct = c.mem_percent ? ` (${c.mem_percent})` : '';
                            const peak = c.peak_mem_gb != null ? c.peak_mem_gb + ' GB' : '—';
                            const text = `RAM: ${mem}${pct} · PEAK: ${peak} · CPU: ${c.cpu_percent || '—'} · PIDs: ${c.pids || '—'}`;
                            if (diagEl.innerText !== text) diagEl.innerText = text;
                        }
                    }
                });
            } catch (e) { console.error("Container fetch error", e); }
        }

        async function fetchAssets() {
            try {
                const resp = await fetch('/api/models');
                const data = await resp.json();
                
                const modelList = document.getElementById('model-list');
                modelList.innerHTML = '';
                data.models.forEach(m => {
                    modelList.innerHTML += `<li class="list-group-item bg-transparent text-light border-secondary small">${m.name}</li>`;
                });

                const loraList = document.getElementById('lora-list');
                if (data.loras.length > 0) {
                    loraList.innerHTML = '';
                    data.loras.forEach(l => {
                        loraList.innerHTML += `
                            <div class="mb-3">
                                <label class="form-label small d-flex justify-content-between">
                                    ${l.name} <span>0.8</span>
                                </label>
                                <input type="range" class="form-range lora-slider" min="0" max="2" step="0.05" value="0.8">
                            </div>
                        `;
                    });
                }
            } catch (e) { console.error("Asset fetch error", e); }
        }

        async function fetchTelemetry() {
            try {
                const resp = await fetch('/api/telemetry');
                const data = await resp.json();
                
                const usedGB = (data.current_used / (1024 ** 3)).toFixed(2);
                const percent = ((data.current_used / data.total) * 100).toFixed(1);
                
                document.getElementById('vram-percent').innerText = `${percent}%`;
                document.getElementById('vram-used').innerText = `${usedGB} GB`;
                document.getElementById('vram-last-sync').innerText = `SYNC: ${new Date().toLocaleTimeString()}`;
                
                const peaksList = document.getElementById('vram-peaks');
                peaksList.innerHTML = '';
                data.peaks.forEach(p => {
                    const peakGB = (p.value / (1024 ** 3)).toFixed(2);
                    peaksList.innerHTML += `<div>[${p.timestamp}] SPIKE: ${peakGB} GB</div>`;
                });
            } catch (e) { console.error("Telemetry error", e); }
        }

        async function queryService(name) {
            const prompt = document.getElementById(`prompt-${name}`).value;
            const resultDiv = document.getElementById(`result-${name}`);
            resultDiv.innerText = "Processing...";
            
            try {
                const resp = await fetch('/api/query', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({service: name.replace(/_/g, '-'), prompt: prompt})
                });
                const data = await resp.json();
                
                if (data.status === "media") {
                    if (data.type === "audio") {
                        resultDiv.innerHTML = `<audio controls src="data:${data.mime};base64,${data.data}" class="mt-2 w-100"></audio>`;
                    } else if (data.type === "image") {
                        resultDiv.innerHTML = `<img src="data:${data.mime};base64,${data.data}" 
                                                    class="img-fluid mt-2 rounded shadow-sm" 
                                                    style="max-height: 400px; cursor: zoom-in;" 
                                                    onclick="openOverlay(this.src)"/>`;
                    }
                } else if (data.choices && data.choices[0] && data.choices[0].message) {
                    resultDiv.innerHTML = `<div class="p-2 border border-secondary rounded" style="background: #111;">${data.choices[0].message.content}</div>`;
                } else {
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                }
            } catch (e) {
                resultDiv.innerText = "Error: " + e.message;
            }
        }

        function openOverlay(src) {
            document.getElementById('overlay-img').src = src;
            document.getElementById('image-overlay').style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeOverlay() {
            document.getElementById('image-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // C-3PO voice mute toggle
        const muteSwitch = document.getElementById('c3po-mute-switch');
        const muteLabel = document.getElementById('c3po-mute-label');
        function renderMute(muted) {
            muteSwitch.checked = !muted;
            muteLabel.textContent = muted ? 'Muted' : 'On';
        }
        fetch('/api/c3po-voice').then(r => r.json()).then(d => renderMute(d.muted)).catch(() => {});
        muteSwitch.addEventListener('change', async () => {
            try {
                const r = await fetch('/api/c3po-voice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ muted: !muteSwitch.checked })
                });
                const d = await r.json();
                renderMute(d.muted);
            } catch (e) {
                renderMute(!muteSwitch.checked);
            }
        });

        fetchProjects();
        fetchContainers();
        fetchAssets();
        fetchTelemetry();
        setInterval(fetchContainers, 5000);
        setInterval(fetchTelemetry, 2000);
    </script>
</body>
</html>
