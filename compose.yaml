name: vox-conjurata
services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYTVkNDVhNjYyMzIzNTE0ZGJlNDU0MTQyMzk0ZjRkMDYiLCJ0IjoiNzhlMmFmODctODU3ZS00NjM2LWE5ODgtODIxNDQ0NDk2MDExIiwicyI6Ik56QXpOVEF6TURVdFlUUmlNaTAwTW1ObUxUZ3dNMkV0TmpSaU1USmlPRE0yTkRZNCJ9
    command: tunnel --no-autoupdate run
    networks:
      - vox-net

  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: vox-conjurata-orchestrator
    ports:
    - 8080:8080
    environment:
    - OLLAMA_URL=http://vox-llm-core:8000
    - VISION_READER_URL=http://vox-vision-reader:8000
    - STT_URL=http://vox-voice:5000
    - TTS_DESIGNER_URL=http://vox-designer:5010
    - TTS_ACTOR_URL=http://vox-actor:5020
    - TTS_MONSTER_URL=http://vox-monster-fish:7860
    - TTS_MUSIC_URL=http://vox-audio-generation-music:8000
    - TTS_SFX_URL=http://vox-audio-generation-sfx:8001
    - IMAGE_GEN_URL=http://vox-vision-gen:8003
    - FOUNDRY_API_URL=http://foundry-vtt:30000/api
    - FOUNDRY_API_KEY=${FOUNDRY_API_KEY}
    volumes:
    - model_storage:/models:z
    - ./services/orchestrator/voice_seeds:/app/voice_seeds:Z
    - /sys:/sys:ro
    networks:
    - vox-net

  foundry-vtt:
    image: node:24-slim
    container_name: foundry-vtt
    working_dir: /app
    volumes:
      - /home/EvokeStudio/manifest-paradigm/foundry/app:/app:z
      - /home/EvokeStudio/manifest-paradigm/foundry/data:/data:z
      - /var/home/EvokeStudio/vox-conjurata:/var/home/EvokeStudio/vox-conjurata:ro,z
    command: ["node", "main.js", "--dataPath=/data"]
    networks:
      - vox-net
    restart: unless-stopped

  caddy:
    image: docker.io/library/caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "30000:30000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
    networks:
      - vox-net
    depends_on:
      - foundry-vtt
      - orchestrator

  vox-vision-reader:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    container_name: vox-vision-reader
    ports:
    - 8002:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - CUDA_VISIBLE_DEVICES=""
    - MODEL=/models/MiniCPM-V-2_6-GGUF/MiniCPM-V-2_6-Q4_K_M.gguf
    - N_GPU_LAYERS=-1
    - CHAT_FORMAT=minicpm-v-2.6
    - VRAM_ALLOCATION=4.80GB
    volumes:
    - model_storage:/models:z
    networks:
    - vox-net
    restart: unless-stopped

  vox-vision:
    build:
      context: ./services/vox-vision
    container_name: vox-vision
    ports:
    - 7860:7860
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - CUDA_VISIBLE_DEVICES=""
    - VRAM_LIMIT=5.50GB
    - QUANTIZATION=nf4
    command: ["python", "main.py", "--pin-shared-memory"]
    networks:
    - vox-net
    restart: unless-stopped

  vox-llm-core:
    container_name: vox-llm-core
    image: rocm/vllm:latest
    ports:
    - 11434:8000
    volumes:
    - model_storage:/models:z
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - PYTORCH_ROCM_ARCH=gfx1201
    - HIP_PLATFORM=amd
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - CUDA_VISIBLE_DEVICES=0
    - VLLM_ROCM_USE_AITER=0
    - GPU_ARCHS=gfx1100
    - VRAM_ALLOCATION=11.20GB
    command: ["python3", "-m", "vllm.entrypoints.openai.api_server", "--model", "/models/EVA-Qwen2.5-14B-v0.2-GGUF/EVA-Qwen2.5-14B-v0.2-Q4_K_M.gguf", "--tokenizer", "Qwen/Qwen2.5-14B-Instruct", "--served-model-name", "Qwen/Qwen2.5-14B-Instruct", "--quantization", "gguf", "--kv-cache-dtype", "fp8", "--max-model-len", "4096", "--gpu-memory-utilization", "0.40"]
    networks:
    - vox-net

  vox-voice:
    build:
      context: ./services/vox-voice
    container_name: vox-voice
    ports:
    - 5000:5000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - CUDA_VISIBLE_DEVICES=""
    networks:
    - vox-net
    restart: unless-stopped

  vox-audio-generation-music:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation-music
    ports:
    - 8000:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - CUDA_VISIBLE_DEVICES=0
    - VRAM_LIMIT=0.80GB
    - HF_TOKEN=${HF_TOKEN}
    - STABLE_AUDIO_MODEL=stabilityai/stable-audio-3-small-music
    volumes:
    - ./cache/huggingface:/root/.cache/huggingface:z
    command: ["python", "tts_engine.py", "--precision", "fp8"]
    networks:
    - vox-net
    restart: unless-stopped

  vox-audio-generation-sfx:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation-sfx
    ports:
    - 8001:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - CUDA_VISIBLE_DEVICES=0
    - AUDIO_ENGINE_TYPE=sfx
    - EXECUTION_DEVICE=gpu
    - VRAM_LIMIT=0.80GB
    - HF_TOKEN=${HF_TOKEN}
    - STABLE_AUDIO_MODEL=stabilityai/stable-audio-3-small-sfx
    volumes:
    - ./cache/huggingface:/root/.cache/huggingface:z
    command: ["python", "tts_engine.py", "--precision", "fp8"]
    networks:
    - vox-net
    restart: unless-stopped

  vox-designer:
    build:
      context: ./services/vox-designer
    container_name: vox-designer
    ports:
    - 5010:5010
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - CUDA_VISIBLE_DEVICES=""
    - QUANTIZATION=int8
    - VRAM_LIMIT=1.20GB
    command: ["python3", "app.py", "--keep_alive", "0"]
    networks:
    - vox-net
    restart: unless-stopped

  vox-actor:
    build:
      context: ./services/vox-actor
    container_name: vox-actor
    ports:
    - 5020:5020
    # ── AMD ROCm device routing ──────────────────────────────────────────
    # Maps host AMD render nodes into the container (mandatory for HIP/ROCm)
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    # Grant access to the 'video' and 'render' groups so ROCm can open /dev/kfd
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    # ── ROCm / HIP configuration ─────────────────────────────────────────
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - PYTORCH_ROCM_ARCH=gfx1201
    - HIP_PLATFORM=amd
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    # ── HARD BLOCK: ensure no CUDA/NVIDIA code path is activated ─────────
    - CUDA_VISIBLE_DEVICES=""
    # ── CosyVoice model location (shared model_storage volume) ───────────
    - COSYVOICE_MODEL_DIR=/models/CosyVoice-300M
    volumes:
    - model_storage:/models:z
    networks:
    - vox-net
    restart: unless-stopped

  vox-monster-fish:
    build:
      context: ./services/vox-monster-fish
    container_name: vox-monster-fish
    entrypoint: ["python", "-m", "tools.api_server"]
    command: ["--listen", "0.0.0.0:7860", "--half"]
    ports:
    - 5030:7860
    volumes:
    - ./vox-monster-voice/models:/app/checkpoints/s2-pro:Z
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - CUDA_VISIBLE_DEVICES=""
    - TEXT_PRECISION=int8
    - VRAM_LIMIT=2.20GB
    networks:
    - vox-net
    restart: unless-stopped

  vox-vision-gen:
    build:
      context: ./services/vox-vision-gen
    container_name: vox-vision-gen
    ports:
    - 8003:8003
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    group_add:
    - video
    - render
    security_opt:
    - seccomp=unconfined
    environment:
    - HSA_OVERRIDE_GFX_VERSION=12.0.1
    - ROCR_VISIBLE_DEVICES=0
    - HIP_VISIBLE_DEVICES=0
    - CUDA_VISIBLE_DEVICES=0
    - VRAM_LIMIT=5.50GB
    - MODEL_PATH=/models/stable-diffusion-xl-base-1.0-Q4_0.gguf
    - LORA_DIR=/loras
    volumes:
    - model_storage:/models:z
    - ./loras:/loras:z
    networks:
    - vox-net
    restart: unless-stopped

networks:
  vox-net:
    name: vox-net
    driver: bridge
volumes:
  model_storage: null
