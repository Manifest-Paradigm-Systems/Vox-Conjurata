name: vox-conjurata
services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYTVkNDVhNjYyMzIzNTE0ZGJlNDU0MTQyMzk0ZjRkMDYiLCJ0IjoiNzhlMmFmODctODU3ZS00NjM2LWE5ODgtODIxNDQ0NDk2MDExIiwicyI6Ik56QXpOVEF6TURVdFlUUmlNaTAwTW1ObUxUZ3dNMkV0TmpSaU1USmlPRE0yTkRZNCJ9
    command: tunnel --no-autoupdate run
    networks:
      - vox-net

  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: vox-conjurata-orchestrator
    ports:
    - 8080:8080
    environment:
    - OLLAMA_URL=http://vox-llm-core:11434
    - STT_URL=http://vox-voice:5000
    - TTS_DESIGNER_URL=http://vox-designer:5010
    - TTS_ACTOR_URL=http://vox-actor:5020
    - TTS_MONSTER_URL=http://vox-monster-fish:7860
    - TTS_MUSIC_URL=http://vox-audio-generation-music:8000
    - TTS_SFX_URL=http://vox-audio-generation-sfx:8001
    volumes:
    - ollama_storage:/root/.ollama:Z
    - ./services/orchestrator/voice_seeds:/app/voice_seeds:Z
    - /sys:/sys:ro
    networks:
    - vox-net

  vox-vision:
    build:
      context: ./services/vox-vision
    container_name: vox-vision
    ports:
    - 7860:7860
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-llm-core:
    container_name: vox-llm-core
    image: rocm/vllm:latest
    ports:
    - 11434:8000
    volumes:
    - ollama_storage:/root/.ollama:Z
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    command: ["--model", "Qwen/Qwen2.5-14B-Instruct", "--kv-cache-dtype", "fp8", "--max-model-len", "4096", "--device", "cuda"]
    networks:
    - vox-net

  vox-voice:
    build:
      context: ./services/vox-voice
    container_name: vox-voice
    ports:
    - 5000:5000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-audio-generation-music:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation-music
    ports:
    - 8000:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-audio-generation-sfx:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation-sfx
    ports:
    - 8001:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    - AUDIO_ENGINE_TYPE=sfx
    networks:
    - vox-net
    restart: unless-stopped

  vox-designer:
    build:
      context: ./services/vox-designer
    container_name: vox-designer
    ports:
    - 5010:5010
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-actor:
    build:
      context: ./services/vox-actor
    container_name: vox-actor
    ports:
    - 5020:5020
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-monster-fish:
    image: fishaudio/fish-speech:latest
    container_name: vox-monster-fish
    entrypoint: ["/app/.venv/bin/python", "-m", "tools.api_server"]
    command: ["--listen", "0.0.0.0:7860", "--half"]
    ports:
    - 5030:7860
    volumes:
    - ./vox-monster-voice/models:/root/.cache/huggingface:Z
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=11.0.0
    networks:
    - vox-net
    restart: unless-stopped

networks:
  vox-net:
    name: vox-net
    driver: bridge
volumes:
  ollama_storage: null
