name: vox-conjurata
services:
  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: vox-conjurata-orchestrator
    ports:
    - 8080:8080
    environment:
    - OLLAMA_URL=http://vox-llm-core:11434
    volumes:
    - ollama_storage:/root/.ollama
  vox-vision:
    build:
      context: ./services/vox-vision
    container_name: vox-vision
    ports:
    - 7860:7860
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
  vox-llm-core:
    container_name: vox-llm-core
    image: ollama/ollama:rocm
    ports:
    - 11434:11434
    volumes:
    - ollama_storage:/root/.ollama
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
  vox-voice:
    build:
      context: ./services/vox-voice
    container_name: vox-voice
    ports:
    - 5000:5000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
  vox-audio-generation:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation
    ports:
    - 8000:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
networks:
  vox-net:
    name: vox-net
    driver: bridge
volumes:
  ollama_storage: null
