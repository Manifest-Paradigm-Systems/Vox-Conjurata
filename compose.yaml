name: vox-conjurata
services:
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=eyJhIjoiYTVkNDVhNjYyMzIzNTE0ZGJlNDU0MTQyMzk0ZjRkMDYiLCJ0IjoiNzhlMmFmODctODU3ZS00NjM2LWE5ODgtODIxNDQ0NDk2MDExIiwicyI6Ik56QXpOVEF6TURVdFlUUmlNaTAwTW1ObUxUZ3dNMkV0TmpSaU1USmlPRE0yTkRZNCJ9
    command: tunnel --no-autoupdate run

  orchestrator:
    build:
      context: ./services/orchestrator
    container_name: vox-conjurata-orchestrator
    ports:
    - 8080:8080
    environment:
    - OLLAMA_URL=http://vox-llm-core:11434
    volumes:
    - ollama_storage:/root/.ollama
    - ./services/orchestrator/voice_seeds:/app/voice_seeds
  vox-vision:
    build:
      context: ./services/vox-vision
    container_name: vox-vision
    ports:
    - 7860:7860
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
  vox-llm-core:
    container_name: vox-llm-core
    image: ollama/ollama:rocm
    ports:
    - 11434:11434
    volumes:
    - ollama_storage:/root/.ollama
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
  vox-voice:
    build:
      context: ./services/vox-voice
    container_name: vox-voice
    ports:
    - 5000:5000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
  vox-audio-generation:
    build:
      context: ./services/vox-audio-generation
    container_name: vox-audio-generation
    ports:
    - 8000:8000
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-designer:
    build:
      context: ./services/vox-designer
    container_name: vox-designer
    ports:
    - 5010:5010
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-actor:
    build:
      context: ./services/vox-actor
    container_name: vox-actor
    ports:
    - 5020:5020
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped

  vox-monster-fish:
    image: fishaudio/fish-speech:latest
    container_name: vox-monster-fish
    entrypoint: ["/app/.venv/bin/python", "-m", "tools.api_server"]
    command: ["--listen", "0.0.0.0:7860", "--half"]
    ports:
    - 5030:7860
    volumes:
    - ./vox-monster-voice/models:/root/.cache/huggingface
    devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
    security_opt:
    - seccomp=unconfined
    group_add:
    - keep-groups
    environment:
    - HSA_OVERRIDE_GFX_VERSION=10.3.0
    networks:
    - vox-net
    restart: unless-stopped
networks:
  vox-net:
    name: vox-net
    driver: bridge
volumes:
  ollama_storage: null
