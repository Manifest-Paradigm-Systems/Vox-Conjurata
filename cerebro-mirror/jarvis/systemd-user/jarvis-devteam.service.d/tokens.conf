[Service]
# Qwen3-30B-A3B-THINKING spends output budget on its reasoning trace BEFORE it writes
# any JSON, and llm.py only strips that trace after generation -- so it is invisible in
# the stored replies. At 12000 the PLAN reply was truncated mid-object and do_plan
# reported "director returned no usable plan" (rc 1).
#
# REPAIR was worse and nobody could see why: stored repair replies measure ~32,000 chars,
# which is ~8000 tokens -- exactly the old REPAIR_TOKENS ceiling. They were being cut off
# mid-JSON, so extract_json returned nothing, verdict defaulted to "abandon", and the item
# was re-blocked with a blank reason. That is the "director returned no verdict" loop seen
# on LPDOC:W-04: not a model that would not answer, a reply that was truncated before it
# got to the answer.
#
# The CONTEXT is already -c 131072 and was never the constraint.
Environment=DEVTEAM_DIRECTOR_TOKENS=24000
Environment=DEVTEAM_REPAIR_TOKENS=20000
