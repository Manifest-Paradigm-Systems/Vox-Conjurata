# Lead with the builtin coder path instead of the aider editor (owner, 2026-09-14).
#
# Why: executor_for_attempt() puts aider on attempt 1 under the default
# DEVTEAM_EXECUTOR=auto. Measured against the runs table on 2026-09-14:
#
#   editor path (93 rows):  17% "did not conform to the edit format"
#                           17% "No filename provided before ```"
#                           38% "only 3 reflections allowed, stopping"
#                           41% summarizer "unexpectedly failed for all models"
#   coder  path (183 rows):  0% on all four signatures
#
# and the coder-bench baseline over 17 real prompts: 17/17 parsed as JSON, 15/15
# emitted Python that compiles, 0 placeholders, 0 syntax errors.
#
# The cost is the other half: an aider attempt runs ~500s against ITEM_BUDGET=420s, so
# an item completed ONE attempt per tick and its remaining two were deferred to later
# ticks. That is precisely what let DOCS:JV-004 burn 44 attempts without converging. A
# builtin attempt is ~65s, so all three attempts now fit inside a single tick.
#
#
# WHY NOT CLAUDE CODE (measured 2026-09-15, so this is not re-litigated):
# Claude Code was installed on cerebro and driven against the same lanes. It works, and
# with --parallel 1 its prompt cache is reused (a toy item went 15min-never-finished ->
# 34s). But on REAL items it ran 82s at best and hit a 2400s timeout on DOCS:JV-002 --
# 2 items in 66 minutes. Its agentic loop re-sends a growing conversation every turn, and
# prompt evaluation is the one phase where MoE sparsity buys nothing (measured: generation
# 6.1 -> 55 t/s across the MoE swap, prompt eval 667 -> 650 t/s, i.e. unchanged). The cost
# is structural, not tunable, so the harness stays. Claude Code remains installed and
# working for INTERACTIVE use on :8081 and :8082.
# Revert: rm this file && systemctl --user daemon-reload
[Service]
Environment=DEVTEAM_EXECUTOR=cerebro-harness
